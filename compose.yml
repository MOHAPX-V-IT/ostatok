services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Generate APP_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://ostatok_app:${APP_DB_PASSWORD}@db:5432/ostatok
      EXPIRY_INTERVAL_SECONDS: ${EXPIRY_INTERVAL_SECONDS:-5}
    ports:
      - "127.0.0.1:4511:4511"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
