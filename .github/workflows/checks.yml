name: PostgreSQL integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: synthetic-ci-cluster-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://ostatok_ci:synthetic-ci-role-password@127.0.0.1:5432/ostatok
      TEST_DATABASE_URL: postgresql://ostatok_ci:synthetic-ci-role-password@127.0.0.1:5432/ostatok_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - name: Create isolated non-superuser role and databases
        env:
          PGPASSWORD: synthetic-ci-cluster-password
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE ostatok_ci LOGIN PASSWORD 'synthetic-ci-role-password' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ostatok OWNER ostatok_ci;"
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE ostatok_test OWNER ostatok_ci;"
      - run: python -m ostatok.cli migrate
      - run: python -m pip check
      - run: python -m compileall -q ostatok tests
      - run: python -m pytest -q
